    <section class="calendario" aria-label="Calendário mensal">
      <div class="mes"><div class="navegacao"><button type="button" (click)="navegar.emit(-1)" aria-label="Mês anterior">‹</button><h2>{{ titulo() }}</h2><button type="button" (click)="navegar.emit(1)" aria-label="Próximo mês">›</button></div><button type="button" (click)="irHoje.emit()">Hoje</button></div>
      <div class="semana">@for(nome of ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];track nome){<span>{{ nome }}</span>}</div>
      <div class="dias">@for(dia of dias();track dia.data){<button type="button" class="dia" [class.outro-mes]="!dia.mesAtual" [class.hoje]="dia.data === hoje()" [class.selecionado]="dia.data === selecionado()" [attr.aria-label]="dia.data + ': ' + dia.total + ' atividades, ' + dia.prazosFatais + ' prazos fatais'" [attr.aria-pressed]="dia.data === selecionado()" (click)="escolher.emit(dia.data)"><span class="numero">{{ dia.numero }}</span>@if(dia.total){<span class="total">{{ dia.total }} <span class="texto-dia">{{ dia.total === 1 ? 'atividade' : 'atividades' }}</span></span>}@if(dia.prazosFatais){<span class="fatal">{{ dia.prazosFatais }} <span class="texto-dia">fatal</span><span class="sr-only">prazos fatais</span></span>}</button>}</div>
      <p class="ajuda">Clique em um dia para consultar suas atividades. Prazos fatais aparecem na data de vencimento.</p>
    </section>
